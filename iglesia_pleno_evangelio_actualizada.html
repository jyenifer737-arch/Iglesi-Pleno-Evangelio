<!doctype html><html lang='es'><head>

<title>Iglesia Pleno Evangelio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&display=swap');
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f5f1e9;display:flex;justify-content:center;font-family:'Playfair Display',Georgia,serif;color:#111}
.page{width:min(100%,430px);min-height:100vh;position:relative;overflow:hidden;padding:55px 24px 35px;display:flex;flex-direction:column;align-items:center}
.content{width:100%;position:relative;z-index:2}
.header{text-align:center;margin:20px 0 28px}
.header h1{font-size:34px;line-height:.95;font-style:italic;margin:0;font-weight:500}
.header p{font-size:18px;margin:5px 0 0}
.description{font-size:25px;text-align:center;margin:0 0 28px}
.links{display:flex;flex-direction:column;gap:14px;width:100%}
.link{display:flex;align-items:center;justify-content:center;min-height:72px;padding:12px 18px;border-radius:17px;text-decoration:none;color:#111;font-size:25px;font-style:italic;border:6px solid rgba(255,255,255,.95);box-shadow:0 1px 4px rgba(0,0,0,.08);transition:.15s}
.link:active{transform:scale(.98)}
.footer{margin-top:auto;padding-top:28px;font-size:14px}
.shape{position:absolute;border-radius:45% 55% 60% 40%;z-index:0}
</style>
<title>Linktree — Lila y azul</title></head><body>
